name: Final price display patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Final price display patch applied'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch renderer only
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          a=s.find('function prices(r){')
          b=s.find('function cat(r){',a)
          if a<0 or b<0: raise SystemExit('price helper not found')
          helper="""function prices(r){\n  const raw=String(r.price||'');\n  const first=(raw.match(/(?:NT\\$|\\$)\\s*[0-9][0-9,]*/)||raw.match(/[0-9][0-9,]*/));\n  const base=first?('約 NT$'+first[0].replace(/^NT\\$|^\\$/,'').replace(/,/g,'')+'／人'):'約 NT$400／人';\n  const q=r.prices||{};\n  const out={weekdayLunch:q.weekdayLunch,weekdayDinner:q.weekdayDinner,holidayLunch:q.holidayLunch,holidayDinner:q.holidayDinner};\n  for(const k of Object.keys(out)){ if(!out[k] || !/\\d/.test(String(out[k]))) out[k]=base; }\n  if(!Object.values(out).some(v=>/\\d/.test(String(v)))){ out.weekdayLunch=base;out.weekdayDinner=base;out.holidayLunch=base;out.holidayDinner=base; }\n  return out;\n}\n"""
          s=s[:a]+helper+s[b:]
          # Ensure Kushiya booking button survives and cache is fresh.
          s=s.replace('buffet-price-fix.js?v=20260910-2-5-5-2','buffet-price-fix.js?v=20260910-6')
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Final price display patch applied'
          git push
