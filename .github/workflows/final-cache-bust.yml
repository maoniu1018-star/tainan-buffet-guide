name: Final cache bust
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Final cache bust applied'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump price script cache key
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('buffet-price-fix.js?v=20260910-2-5-5-2','buffet-price-fix.js?v=20260910-final')
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Final cache bust applied'
          git push
