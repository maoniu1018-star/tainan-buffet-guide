name: Research ratings and official links
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  research:
    if: github.event.head_commit.message != 'Auto update verified ratings and official links'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Research Google ratings and official URLs
        shell: python
        run: |
          import re, time, json, html
          from pathlib import Path
          from urllib.parse import quote, urlparse
          from urllib.request import Request, urlopen

          def fetch(url):
              req=Request(url, headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'})
              with urlopen(req, timeout=15) as r:
                  return r.read().decode('utf-8','ignore'), r.geturl()

          def search_bing(q):
              try:
                  body,_=fetch('https://www.bing.com/search?q='+quote(q))
                  # Extract result blocks in a tolerant way.
                  blocks=re.findall(r'<li class="b_algo"[\\s\\S]*?</li>', body, flags=re.I)
                  out=[]
                  for b in blocks[:8]:
                      mt=re.search(r'<h2[^>]*>\\s*<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>', b, flags=re.I|re.S)
                      if not mt: continue
                      u=html.unescape(re.sub('<[^>]+>','',mt.group(1)))
                      title=html.unescape(re.sub('<[^>]+>','',mt.group(2))).strip()
                      sn=re.search(r'<p>([\\s\\S]*?)</p>', b, flags=re.I)
                      snippet=html.unescape(re.sub('<[^>]+>','',sn.group(1))).strip() if sn else ''
                      out.append((title,snippet,u))
                  return out
              except Exception as e:
                  print('BING ERROR',q,e)
                  return []

          def parse_rating(text):
              text=re.sub(r'\\s+',' ',text)
              pats=[
                r'Google評價\\s*[:：]?\\s*([0-5]\\.\\d)\\s*/\\s*([0-9,]+)\\s*(?:則|筆)',
                r'Google評分\\s*[:：]?\\s*([0-5]\\.\\d)\\s*/\\s*([0-9,]+)\\s*(?:則|筆)',
                r'([0-5]\\.\\d)\\s*[/／]5\\s*[·•]\\s*Google[^0-9]{0,10}\\(?([0-9,]+)\\s*(?:則|reviews|review)',
                r'([0-5]\\.\\d)\\s*\\(([0-9,]{2,})\\)',
              ]
              for p in pats:
                  m=re.search(p,text,re.I)
                  if m:
                      return float(m.group(1)), int(m.group(2).replace(',',''))
              return None

          def parse_url(title,url):
              bad={'fonfood.com','facebook.com','instagram.com','youtube.com','tripadvisor.com','google.com','google.com.tw','ubereats.com','foodpanda.com.tw','inline.app','walkerland.com.tw','ifoodie.tw','supertaste.tvbs.com.tw','opentable.com','tablecheck.com','kkday.com'}
              host=urlparse(url).netloc.lower().replace('www.','')
              if any(host==d or host.endswith('.'+d) for d in bad): return None
              return url

          def parse_names(text):
              return re.findall(r"name:'([^']+)'", text)

          data=Path('data.js').read_text(encoding='utf-8')
          extra=Path('restore-82.js').read_text(encoding='utf-8') if Path('restore-82.js').exists() else ''
          merged=data+'\n'+extra
          names=[]
          seen=set()
          for n in parse_names(merged):
              if n not in seen:
                  seen.add(n); names.append(n)

          # Read ratings/official links that already exist.
          existing={}
          for m in re.finditer(r"name:'([^']+)'([\\s\\S]*?)(?=\\n\\{name:|\\n\\]);)", merged):
              n=m.group(1); block=m.group(2)
              rating=re.search(r'rating:([0-5]\\.\\d)',block)
              reviews=re.search(r'reviewCount:([0-9]+)',block)
              off=re.search(r"official:'([^']+)'",block)
              if rating:
                  existing[n]={'rating':float(rating.group(1)),'reviewCount':int(reviews.group(1)) if reviews else None}
              if off: existing.setdefault(n,{})['official']=off.group(1)

          missing=[n for n in names if not existing.get(n,{}).get('rating')]
          print('TOTAL',len(names),'MISSING RATINGS',len(missing))

          ratings={}
          officials={}
          for i,n in enumerate(missing,1):
              q=f'"{n}" 台南 Google 評分'
              results=search_bing(q)
              best=None
              for title,sn,url in results:
                  blob=(title+' '+sn).lower()
                  if n.lower() not in blob and n.replace('台南','').lower() not in blob:
                      continue
                  rr=parse_rating(title+' '+sn)
                  if rr:
                      best=(rr[0],rr[1]); break
              if best: ratings[n]=best
              print(f'[{i}/{len(missing)}] {n} -> {best}')
              time.sleep(0.35)

          # Validate and repair existing official links; search missing ones too.
          for n in names:
              off=existing.get(n,{}).get('official')
              if off:
                  try:
                      req=Request(off,headers={'User-Agent':'Mozilla/5.0'})
                      with urlopen(req,timeout=10) as r:
                          if int(getattr(r,'status',200)) < 400:
                              officials[n]=off
                              continue
                  except Exception:
                      pass
              results=search_bing(f'"{n}" 台南 官方網站')
              for title,sn,url in results:
                  u=parse_url(title,url)
                  if u and n.replace('台南','').lower() in (title+' '+sn).lower():
                      officials[n]=u; break
              time.sleep(0.2)

          payload={}
          for n,v in ratings.items():
              payload[n]={'rating':v[0],'reviewCount':v[1]}
          for n,u in officials.items():
              payload.setdefault(n,{})['official']=u

          out=['/* Auto-researched Google ratings and verified official links. Data-only; no DOM access. */','window.RATING_OFFICIAL_FIX='+json.dumps(payload,ensure_ascii=False,separators=(',',':'))+';','(function(){const d=window.RESTAURANTS||[];const m=window.RATING_OFFICIAL_FIX||{};for(const r of d){const x=m[r.name];if(!x)continue;if(x.rating!=null){r.rating=x.rating;r.reviewCount=x.reviewCount;r.ratingSource=\'Google Maps\';}if(x.official)r.official=x.official;}})();','']
          Path('rating-official-fix.js').write_text('\n'.join(out),encoding='utf-8')
          print('WROTE',len(payload),'FIX RECORDS')
      - name: Load the fix script
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="rating-official-fix.js?v=20260910"></script>'
          if 'rating-official-fix.js?v=20260910' not in s:
              s=s.replace('<script src="buffet-price-fix.js?v=20260910-final"></script>', '<script src="buffet-price-fix.js?v=20260910-final"></script>\n'+tag)
              p.write_text(s,encoding='utf-8')
      - name: Commit researched fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rating-official-fix.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Auto update verified ratings and official links'
          git push
