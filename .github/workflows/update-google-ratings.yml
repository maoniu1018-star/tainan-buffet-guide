name: Update Google ratings
on:
  push:
    paths:
      - '.github/workflows/update-google-ratings.yml'
      - 'contact-rating-fix.js'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Google rating map
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('contact-rating-fix.js')
          s=p.read_text(encoding='utf-8')
          block="""const googleRatings={
          '億品鍋 成大勝利店':{rating:4.6},
          '武灰鍋 平價個人小火鍋':{rating:5.0},
          '武灰鍋平價個人小火鍋':{rating:5.0},
          '武灰鍋 平價小火鍋 安和店':{rating:4.5},
          '九鼎鍋 開元店':{rating:4.7},
          '九鼎鍋 大同店':{rating:4.8},
          'XM 麻辣鍋':{rating:4.3},
          '嗑肉石鍋 東門店':{rating:5.0},
          '牧鍋 頂級熟成牛鍋物':{rating:4.5,reviewCount:1731},
          '井賀鍋物 文賢店':{rating:4.5},
          '兩餐 Dookki 台南店':{rating:4.1,reviewCount:2351},
          '串家物語 台南三井店':{rating:3.9,reviewCount:967},
          '灼花燒肉 HIBANA × 深煙酒吧 SHINEN':{rating:4.3,reviewCount:499},
          '燒肉眾 台南永康店':{rating:4.5,reviewCount:752},
          '魔力牛牛排館 安南安中店':{rating:4.2,reviewCount:1106},
          '遠東 CAFÉ 台南遠東香格里拉':{rating:4.3,reviewCount:2800},
          '桂田酒店 阿力海百匯餐廳':{rating:4.6,reviewCount:16970},
          '甘粹餐廳（台南老爺行旅）':{rating:3.9,reviewCount:1400},
          '饗翻天臭臭鍋 新營店':{rating:4.8},
          '饗翻天臭臭鍋〖新營店〗':{rating:4.8},
          '饗翻天臭臭鍋 南區中華南店':{rating:4.5},
          '饗翻天臭臭鍋〖南區中華南店〗':{rating:4.5},
          '一個圓鍋火鍋店':{rating:4.8},
          '井賀鍋物 安南店':{rating:4.5}
          };"""
          # Preserve all existing entries that are not in the new authoritative map.
          old=re.search(r'const googleRatings=\{.*?\n  \};',s,re.S)
          if not old:
              raise SystemExit('googleRatings block not found')
          new=block.replace('\n          ','\n    ').replace('\n};','\n  };')
          # Make formatting consistent with surrounding file.
          new=new.replace('const googleRatings={','const googleRatings={')
          s=s[:old.start()]+new+s[old.end():]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit rating map
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contact-rating-fix.js
          git diff --cached --quiet || git commit -m 'fix: fill verified Google ratings'
          git push
