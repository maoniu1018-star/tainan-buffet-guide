name: Weekly Tainan Buffet Watch and Data Audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'data.js'
      - 'audit-data.js'
      - 'buffet-watch.js'
      - '.github/workflows/monthly-update.yml'
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

jobs:
  audit-and-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit published restaurant data
        run: node audit-data.js
      - name: Search recent Tainan buffet and self-service updates
        run: node buffet-watch.js
      - name: Commit audit and watch reports
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-audit-report.md buffet-watch-report.md
          git diff --cached --quiet || git commit -m "chore: update weekly buffet watch reports"
          git push
