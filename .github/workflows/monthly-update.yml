name: Published Restaurant Data Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "15 19 1 * *"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit the data actually used by the website
        run: node audit-data.js
      - name: Commit audit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-audit-report.md
          git diff --cached --quiet || git commit -m "chore: audit published restaurant data"
          git push
