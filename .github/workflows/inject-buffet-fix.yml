name: Inject Buffet price fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure targeted correction script is loaded
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'index.html';
            const file = await github.rest.repos.getContent({owner, repo, path, ref:'main'});
            const current = Buffer.from(file.data.content, 'base64').toString('utf8');
            const marker = '<script src="buffet-price-fix.js"></script>';
            if (!current.includes(marker)) {
              const needle = '<script src="restore-82.js"></script>';
              const updated = current.replace(needle, needle + '\n' + marker);
              if (updated === current) core.setFailed('Target script insertion point was not found.');
              else {
                await github.rest.repos.createOrUpdateFileContents({
                  owner, repo, path,
                  message: 'Load Buffet price and booking corrections',
                  content: Buffer.from(updated).toString('base64'),
                  sha: file.data.sha,
                  branch: 'main'
                });
              }
            }
