name: Inject Buffet price fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure targeted correction script is loaded safely
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'index.html';
            const file = await github.rest.repos.getContent({owner, repo, path, ref:'main'});
            let current = Buffer.from(file.data.content, 'base64').toString('utf8');
            let updated = current;
            updated = updated.replaceAll('buffet-price-fix.js?v=20260910.js', 'buffet-price-fix.js?v=20260910-2');
            updated = updated.replaceAll('buffet-price-fix.js?v=20260910', 'buffet-price-fix.js?v=20260910-2');
            const plain = '<script src="buffet-price-fix.js"></script>';
            const fixed = '<script src="buffet-price-fix.js?v=20260910-2"></script>';
            if (!updated.includes('buffet-price-fix.js?v=20260910-2') && updated.includes(plain)) {
              updated = updated.replace(plain, fixed);
            }
            if (updated !== current) {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path,
                message: 'Use safe Buffet correction script version',
                content: Buffer.from(updated).toString('base64'),
                sha: file.data.sha,
                branch: 'main'
              });
            }
