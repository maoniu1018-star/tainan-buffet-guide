name: Inject Buffet price fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure targeted correction scripts are loaded with cache busting
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'index.html';
            const file = await github.rest.repos.getContent({owner, repo, path, ref:'main'});
            let current = Buffer.from(file.data.content, 'base64').toString('utf8');
            let updated = current
              .replaceAll('data.js?v=20260910', 'data.js?v=20260910')
              .replaceAll('restore-82.js?v=20260910', 'restore-82.js?v=20260910')
              .replaceAll('buffet-price-fix.js?v=20260910', 'buffet-price-fix.js?v=20260910');
            updated = updated
              .replace('<script src="data.js"></script>', '<script src="data.js?v=20260910"></script>')
              .replace('<script src="restore-82.js"></script>', '<script src="restore-82.js?v=20260910"></script>')
              .replace('<script src="buffet-price-fix.js"></script>', '<script src="buffet-price-fix.js?v=20260910"></script>');
            if (updated !== current) {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path,
                message: 'Force fresh data scripts for stable Pages render',
                content: Buffer.from(updated).toString('base64'),
                sha: file.data.sha,
                branch: 'main'
              });
            }
