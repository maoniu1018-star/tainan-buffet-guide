name: One-time price repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message != 'Apply complete restaurant price display repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair price display and booking button
        shell: python
        run: |
          from pathlib import Path
          import re
          root=Path('.')
          mp={
            '涮乃葉 台南大全聯店':'平日約 NT$440／人；晚餐／假日約 NT$490／人','涮乃葉 台南三井店':'平日約 NT$440／人；晚餐／假日約 NT$490／人','億品鍋 台南健康店':'約 NT$205／人','億品鍋 台南仁德店':'約 NT$230／人','億品鍋 台南永康店':'約 NT$230／人','億品鍋 台南安南店':'約 NT$230／人','億品鍋 成大勝利店':'約 NT$200／人','億品鍋 惠南旗艦店':'約 NT$200／人','武灰鍋 平價小火鍋 安和店':'約 NT$200／人','XM 麻辣鍋':'約 NT$699／人','GAMMA（尬麻）火鍋聚場':'平日午餐約 NT$699／人；晚餐／假日約 NT$859／人','嗑肉石鍋 東門店':'約 NT$499／人','牧鍋 頂級熟成牛鍋物':'約 NT$500／人','井賀鍋物 文賢店':'平日約 NT$288／人；假日約 NT$368／人','狂一鍋 台南仁德店':'約 NT$450／人','肉多多火鍋 台南東寧店':'約 NT$439／人','肉多多火鍋 台南怡平店':'約 NT$439／人','肉多多火鍋 台南大遠百公園店':'約 NT$439／人','兩餐 Dookki 台南店':'基本方案約 NT$299／人；肉肉吃到飽約 NT$399／人＋10%清潔費','串家物語 台南三井店':'約 NT$499／人','逐鹿炭火燒肉 台南店':'約 NT$769／人＋10%服務費','灼花燒肉 HIBANA × 深煙酒吧 SHINEN':'約 NT$799／人','Oh! Yaki 精緻燒肉吃到飽 台南店':'約 NT$599–899／人','一底夯燒肉專賣 東平店':'約 NT$699／人','田季發爺燒肉 台南中華店':'約 NT$618–988／人＋10%服務費','本格和牛燒肉放題 台南西門店':'約 NT$799／人','好好吃肉韓式烤肉吃到飽 台南店':'約 NT$599／人','吃道飽火烤兩吃':'約 NT$499／人','燒肉眾 台南永康店':'約 NT$599／人＋10%清潔費','小時厚牛排 台南東區店':'約 NT$300–450／人','小時厚牛排 台南健康店':'約 NT$300–450／人','小時厚牛排 台南永康店':'約 NT$300–450／人','達樂斯美式牛排 東門店':'約 NT$260／人','達樂斯美式牛排 永康店':'約 NT$260／人','牛B牛排':'約 NT$300／人','魔力牛牛排館 安平文平店':'約 NT$300／人','魔力牛牛排館 安南安中店':'約 NT$300／人','牛室炙燒牛排 BEEFHOUSE 台南海安店':'約 NT$339–450／人','奇美食品幸福工廠':'成人約 NT$158／人','遠東 CAFÉ 台南遠東香格里拉':'約 NT$1,180–1,480／人＋10%','漢來海港 台南南紡店':'約 NT$800–1,200／人','台糖長榮酒店 吃遍天下自助餐廳':'約 NT$1,050–1,250／人＋10%','桂田酒店 阿力海百匯餐廳':'約 NT$1,360–1,790／人＋10%','食東西自助餐廳（煙波台南館）':'約 NT$630–680／人＋10%','榕廷百匯餐廳（禧榕軒）':'約 NT$880–1,080／人＋10%','福爾摩沙遊艇酒店－威尼斯餐廳':'約 NT$1,150–1,250／人＋10%','夏都城食百匯自助餐廳':'約 NT$900–1,200／人＋10%','元素餐廳（台南大員皇冠假日酒店）':'約 NT$759–1,399／人＋10%','台南大飯店 歐式自助餐':'約 NT$880／人'}
          for fn in ['data.js','restore-82.js']:
            s=(root/fn).read_text(encoding='utf-8')
            for name,val in mp.items():
              pat=r"(\{name:'"+re.escape(name)+r"'[^\n]*?price:)'([^']*)'"
              s=re.sub(pat, lambda m:m.group(1)+("'"+val+"'" if not re.search(r'\d',m.group(2)) else "'"+m.group(2)+"'"), s, flags=re.S)
            (root/fn).write_text(s,encoding='utf-8')
          p=root/'buffet-price-fix.js'
          p.write_text("""/* Data-only correction: no DOM access */\n(function(){\n  const map={'奇美食品幸福工廠':'成人約 NT$158／人','遠東 CAFÉ 台南遠東香格里拉':'約 NT$1,180–1,480／人＋10%','漢來海港 台南南紡店':'約 NT$800–1,200／人','台糖長榮酒店 吃遍天下自助餐廳':'約 NT$1,050–1,250／人＋10%','桂田酒店 阿力海百匯餐廳':'約 NT$1,360–1,790／人＋10%','食東西自助餐廳（煙波台南館）':'約 NT$630–680／人＋10%','榕廷百匯餐廳（禧榕軒）':'約 NT$880–1,080／人＋10%','福爾摩沙遊艇酒店－威尼斯餐廳':'約 NT$1,150–1,250／人＋10%','夏都城食百匯自助餐廳':'約 NT$900–1,200／人＋10%','元素餐廳（台南大員皇冠假日酒店）':'約 NT$759–1,399／人＋10%','台南大飯店 歐式自助餐':'約 NT$880／人'};\n  for(const r of (window.RESTAURANTS||[])) if(map[r.name]) r.price=map[r.name];\n  const x=(window.RESTAURANTS||[]).find(r=>r.name==='串家物語 台南三井店');\n  if(x) x.bookingUrl='https://inline.app/booking/-L3RNFbAlXuITYXJJ3v7/-MuAhjlIDbmHRz8OWmzH';\n})();\n""",encoding='utf-8')
          idx=root/'index.html'; s=idx.read_text(encoding='utf-8')
          for q in ['buffet-price-fix.js?v=20260910-2','buffet-price-fix.js?v=20260910-3','buffet-price-fix.js?v=20260910-4','buffet-price-fix.js?v=20260910']:
            s=s.replace(q,'buffet-price-fix.js?v=20260910-5')
          a=s.find('function prices(r){'); b=s.find('function cat(r){',a)
          helper="""function prices(r){const s=String(r.price||'');if(r.prices&&Object.values(r.prices).some(v=>v&&/\\d/.test(String(v))))return r.prices;let base=s;if(!/\\d/.test(base))base='約 NT$400／人';const p={weekdayLunch:base,weekdayDinner:base,holidayLunch:base,holidayDinner:base};const parts=base.split('；');for(const part of parts){if(part.includes('平日')&&part.includes('午'))p.weekdayLunch=part.replace(/^.*?午餐?\\s*/,'')||base;else if(part.includes('平日')&&part.includes('晚'))p.weekdayDinner=part.replace(/^.*?晚餐?\\s*/,'')||base;else if(part.includes('假日')&&part.includes('午'))p.holidayLunch=part.replace(/^.*?午餐?\\s*/,'')||base;else if(part.includes('假日')&&part.includes('晚'))p.holidayDinner=part.replace(/^.*?晚餐?\\s*/,'')||base;}return p}\n"""
          if a>=0 and b>a: s=s[:a]+helper+s[b:]
          s=s.replace("${r.official?`<a href=\"${esc(r.official)}\" target=\"_blank\" rel=\"noopener\">🌐 官方網站</a>`:''}</div>`;$('modal').classList.add('show')","${r.official?`<a href=\"${esc(r.official)}\" target=\"_blank\" rel=\"noopener\">🌐 官方網站</a>`:''}${r.bookingUrl?`<a href=\"${esc(r.bookingUrl)}\" target=\"_blank\" rel=\"noopener\">🔴 官方訂位</a>`:''}</div>`;$('modal').classList.add('show')")
          s=s.replace("${r.official?`<a href=\"${esc(r.official)}\" target=\"_blank\" rel=\"noopener\">🌐 官方網站</a>`:''}</div></article>","${r.official?`<a href=\"${esc(r.official)}\" target=\"_blank\" rel=\"noopener\">🌐 官方網站</a>`:''}${r.bookingUrl?`<a href=\"${esc(r.bookingUrl)}\" target=\"_blank\" rel=\"noopener\">🔴 官方訂位</a>`:''}</div></article>")
          idx.write_text(s,encoding='utf-8')
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data.js restore-82.js buffet-price-fix.js index.html
          git diff --cached --quiet || git commit -m 'Apply complete restaurant price display repair'
          git push
