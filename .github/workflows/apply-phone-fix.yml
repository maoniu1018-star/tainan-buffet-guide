name: Apply restaurant phone updates

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-phones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update verified phone numbers and phone buttons
        shell: python
        run: |
          from pathlib import Path
          import re

          phones = {
            '饗麻饗辣 台南永華旗艦店':'06-299-7676',
            '億品鍋 台南健康店':'06-214-5963',
            '億品鍋 台南仁德店':'06-279-5381',
            '億品鍋 台南永康店':'06-231-9700',
            '億品鍋 台南麻豆店':'06-571-3805',
            '億品鍋 台南佳里店':'06-723-6111',
            '億品鍋 惠南旗艦店':'06-263-3175',
            '億品鍋 成大勝利店':'06-236-1613',
            '武灰鍋 平價個人小火鍋':'06-358-3988',
            '九鼎鍋 開元店':'06-200-5529',
            'XM 麻辣鍋':'06-302-5299',
            'GAMMA（尬麻）火鍋聚場':'06-209-0095',
            '牧鍋 頂級熟成牛鍋物':'06-237-0222',
            '井賀鍋物 文賢店':'06-358-0888',
            '井賀鍋物 安南店':'06-356-3888',
            '狂一鍋 台南仁德店':'06-279-7321',
            '肉多多火鍋 台南東寧店':'06-200-5818',
            '肉多多火鍋 台南怡平店':'06-295-8999',
            '肉多多火鍋 台南新仁店':'06-268-0059',
            '兩餐 Dookki 台南店':'06-222-0689',
            '逐鹿炭火燒肉 台南店':'06-222-3322',
            '灼花燒肉 HIBANA':'06-221-8859',
            '灼花燒肉 HIBANA × 深煙酒吧 SHINEN':'06-221-8859',
            'Oh! Yaki 精緻燒肉吃到飽 台南店':'06-220-9819',
            '一底夯燒肉專賣 東平店':'06-208-6367',
            '燒肉眾 台南永康店':'06-207-3522',
            '田季發爺燒肉 台南中華店':'06-267-3070',
            '本格和牛燒肉放題 台南西門店':'06-252-2333',
            '吃道飽火烤兩吃':'06-303-5559',
            '小時厚牛排 台南東區店':'06-267-9366',
            '小時厚牛排 台南健康店':'06-263-0303',
            '公牛隊牛排館':'06-202-9709',
            '達樂斯美式牛排 東門店':'06-267-5388',
            '達樂斯美式牛排 永康店':'06-253-9775',
            '牛B牛排':'06-299-2829',
            '魔力牛牛排館 安平文平店':'06-295-0113',
            '魔力牛牛排館 安南安中店':'06-247-9616',
            '牛室炙燒牛排 BEEFHOUSE 台南海安店':'06-251-0630',
            '鬥牛士石燒牛排 台南Focus店':'06-220-7366',
            '奇美食品幸福工廠':'06-269-8588',
            '遠東 Café 台南遠東香格里拉':'06-702-8856',
            '遠東 CAFÉ 台南遠東香格里拉':'06-702-8856',
            '台糖長榮酒店 吃遍天下自助餐廳':'06-337-3865',
            '食東西自助餐廳（煙波台南館）':'06-214-1200',
            '榕廷百匯餐廳（禧榕軒）':'06-223-7988',
            '福爾摩沙遊艇酒店－威尼斯餐廳':'06-391-2188',
            '饗翻天臭臭鍋 新營店':'06-656-1116',
            '饗翻天臭臭鍋 永康鹽行店':'06-253-0815',
            '饗翻天臭臭鍋 南區中華南店':'06-262-4462',
            '饗翻天臭臭鍋 永康南台店':'06-243-4045',
            '十色鍋物':'06-289-0636',
            '温玥坊鍋物':'06-203-6608',
            '蕾鼎鍋物':'06-297-8585',
            '一個圓鍋火鍋店':'06-251-2129',
            '橫濱牛排 台南三井店':'06-303-2563',
            '温家堡燒肉吃到飽':'06-203-2888',
            '咚豬咚豬 韓國烤肉吃到飽 台南東區中華門市':'06-267-8008',
            '億品鍋 台南頂美店 MINI SHABU SHABU':'06-358-9449',
            '牛約客牛排屋':'06-280-7113',
            '月季 特色鴛鴦火鍋吃到飽':'06-267-8778',
          }

          for filename in ['data.js','restore-82.js']:
              p=Path(filename)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              for name, phone in phones.items():
                  pattern = r"(name:'" + re.escape(name) + r"'[^\n]*?phone:')([^']*)(')"
                  s, n = re.subn(pattern, lambda m: m.group(1)+phone+m.group(3), s, count=1)
              p.write_text(s, encoding='utf-8')

          # Load the verified phone override after all restaurant data/fixes.
          idx=Path('index.html')
          s=idx.read_text(encoding='utf-8')
          if 'phone-fix.js' not in s:
              needle='<script src="buffet-price-fix.js?v=20260910-20260910-1"></script>'
              insert=needle+'\n<script src="phone-fix.js?v=20260910-1"></script>'
              if needle in s:
                  s=s.replace(needle,insert,1)
          # Keep direct-call metadata support available.
          if 'phone-action-fix' not in s:
              inject='''\n<script id="phone-action-fix">\n(function(){\n  const norm=p=>String(p||'').replace(/[^0-9+]/g,'');\n  const isPhone=p=>/^06\\d{7,8}$/.test(norm(p)) || /^0[2-8]\\d{7,8}$/.test(norm(p));\n  (window.RESTAURANTS||[]).forEach(r=>{if(r.phone && isPhone(r.phone)) r.phoneDisplay=r.phone;});\n})();\n</script>\n'''
              s=s.replace('</body>',inject+'</body>')
          idx.write_text(s,encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js restore-82.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: add verified restaurant phone numbers"
          git push
