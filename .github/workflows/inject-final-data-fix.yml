name: Inject final data quality fix
on:
  push:
    branches: [main]
    paths:
      - 'final-data-fix.js'
      - '.github/workflows/inject-final-data-fix.yml'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load final data fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          script='<script src="final-data-fix.js?v=20260910-1"></script>'
          pattern=r'<script src="final-data-fix\.js\?v=[^"]+"></script>'
          if re.search(pattern,s):
              s=re.sub(pattern,script,s)
          else:
              marker='<script src="phone-fix.js?v=20260910-1"></script>'
              if marker in s:
                  s=s.replace(marker,marker+'\n'+script,1)
              else:
                  s=s.replace('</body>',script+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit index update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'chore: load final data quality fix'
          git push
