name: Integrate verified phone fixes
on:
  push:
    paths:
      - 'phone-fix.js'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add phone-fix script to index
        shell: bash
        run: |
          set -e
          if ! grep -q 'phone-fix.js' index.html; then
            python3 - <<'PY'
from pathlib import Path
p=Path('index.html')
s=p.read_text(encoding='utf-8')
needle='<script src="buffet-price-fix.js?v=20260910-20260910-1"></script>'
insert=needle+'\n<script src="phone-fix.js?v=20260910-1"></script>'
if needle not in s:
    raise SystemExit('target script tag not found')
p.write_text(s.replace(needle, insert, 1), encoding='utf-8')
PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'chore: integrate verified phone fixes'
            git push
          fi
