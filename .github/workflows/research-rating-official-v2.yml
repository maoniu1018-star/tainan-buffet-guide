name: Research ratings and official links v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  research:
    if: github.event.head_commit.message != 'Auto update ratings and official links v2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Research missing Google ratings and validate official links
        shell: python
        run: |
          import re, time, json, html
          from pathlib import Path
          from urllib.parse import quote, urlparse
          from urllib.request import Request, urlopen

          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          def fetch(url):
              req=Request(url,headers={'User-Agent':UA,'Accept-Language':'zh-TW,zh;q=0.9,en;q=0.7'})
              with urlopen(req,timeout=20) as r:
                  return r.read().decode('utf-8','ignore'), r.geturl()
          def strip(s): return html.unescape(re.sub(r'<[^>]+>',' ',s))
          def ddg(q):
              try:
                  body,_=fetch('https://html.duckduckgo.com/html/?q='+quote(q))
                  items=re.findall(r'<div class="result__body">(.*?)</div>\\s*</div>',body,re.I|re.S)
                  out=[]
                  for b in items[:10]:
                      mt=re.search(r'class="result__a"[^>]*href="([^"]+)"[^>]*>(.*?)</a>',b,re.I|re.S)
                      if not mt: continue
                      title=strip(mt.group(2)); url=html.unescape(mt.group(1))
                      ms=re.search(r'class="result__snippet"[^>]*>(.*?)</a>',b,re.I|re.S) or re.search(r'class="result__snippet"[^>]*>(.*?)</div>',b,re.I|re.S)
                      sn=strip(ms.group(1)) if ms else ''
                      out.append((title,sn,url))
                  return out
              except Exception as e:
                  print('SEARCH_ERROR',e)
                  return []
          def parse_rating(text):
              t=re.sub(r'\\s+',' ',text)
              pats=[r'Google評價\\s*[:：]?\\s*([0-5]\\.\\d)\\s*/\\s*([0-9,]+)\\s*(?:則|筆)',r'Google評分\\s*[:：]?\\s*([0-5]\\.\\d)\\s*/\\s*([0-9,]+)\\s*(?:則|筆)',r'Google[^0-9]{0,20}([0-5]\\.\\d)\\s*\\(?([0-9,]{2,})\\)?\\s*(?:則|筆|reviews?)',r'([0-5]\\.\\d)\\s*/\\s*5\\s*\\(?([0-9,]{2,})\\)?']
              for p in pats:
                  m=re.search(p,t,re.I)
                  if m: return float(m.group(1)),int(m.group(2).replace(',',''))
              return None
          def good_official(url):
              bad={'fonfood.com','facebook.com','instagram.com','youtube.com','google.com','google.com.tw','tripadvisor.com','ubereats.com','foodpanda.com.tw','inline.app','ifoodie.tw','walkerland.com.tw','supertaste.tvbs.com.tw','opentable.com','tablecheck.com','kkday.com'}
              host=urlparse(url).netloc.lower().replace('www.','')
              return host and not any(host==x or host.endswith('.'+x) for x in bad)
          def blocks(text):
              parts=re.split(r'\\n(?=\\{name:)',text)
              return [p for p in parts if "name:'" in p]
          data=Path('data.js').read_text(encoding='utf-8')
          extra=Path('restore-82.js').read_text(encoding='utf-8') if Path('restore-82.js').exists() else ''
          bs=blocks(data+'\\n'+extra)
          records=[]; seen=set()
          for b in bs:
              m=re.search(r"name:'([^']+)'",b)
              if not m: continue
              n=m.group(1)
              if n in seen: continue
              seen.add(n)
              r=re.search(r'rating:([0-5]\\.\\d)',b); c=re.search(r'reviewCount:([0-9]+)',b); o=re.search(r"official:'([^']+)'",b)
              records.append((n,float(r.group(1)) if r else None,int(c.group(1)) if c else None,o.group(1) if o else None))
          print('TOTAL',len(records),'existing ratings',sum(x[1] is not None for x in records))
          rating_fix={}; official_fix={}
          for idx,(n,r,c,o) in enumerate(records,1):
              if r is None:
                  res=ddg('"'+n+'" 台南 Google評價')
                  best=None
                  for title,sn,url in res:
                      text=title+' '+sn
                      if n.replace('台南','').lower() in text.lower() or n.lower() in text.lower():
                          rr=parse_rating(text)
                          if rr: best=rr; break
                  if best: rating_fix[n]={'rating':best[0],'reviewCount':best[1]}
                  print(f'RATING {idx}/{len(records)} {n} => {best}')
                  time.sleep(.3)
          for idx,(n,r,c,o) in enumerate(records,1):
              if o and good_official(o):
                  try:
                      req=Request(o,headers={'User-Agent':UA})
                      with urlopen(req,timeout=10) as resp:
                          if int(getattr(resp,'status',200))<400:
                              official_fix[n]=o; continue
                  except Exception: pass
              res=ddg('"'+n+'" 台南 官方網站')
              found=None
              for title,sn,url in res:
                  if not good_official(url): continue
                  text=title+' '+sn
                  if n.replace('台南','').lower() in text.lower(): found=url; break
              if found: official_fix[n]=found
              print(f'OFFICIAL {idx}/{len(records)} {n} => {found}')
              time.sleep(.2)
          payload={}
          for n,v in rating_fix.items(): payload[n]=v
          for n,u in official_fix.items(): payload.setdefault(n,{})['official']=u
          Path('rating-official-fix.js').write_text('window.RATING_OFFICIAL_FIX='+json.dumps(payload,ensure_ascii=False,separators=(",",":"))+';\\n(function(){const d=window.RESTAURANTS||[];const m=window.RATING_OFFICIAL_FIX||{};for(const r of d){const x=m[r.name];if(!x)continue;if(x.rating!=null){r.rating=x.rating;r.reviewCount=x.reviewCount;r.ratingSource="Google Maps";}if(x.official)r.official=x.official;}})();\\n',encoding='utf-8')
          print('FIX RECORDS',len(payload),'RATINGS',len(rating_fix),'OFFICIAL',len(official_fix))
          Path('research-summary.json').write_text(json.dumps({'total':len(records),'existingRatings':sum(x[1] is not None for x in records),'researchedRatings':len(rating_fix),'officials':len(official_fix),'payload':payload},ensure_ascii=False,indent=2),encoding='utf-8')
      - name: Load v2 fix script
        shell: python
        run: |
          import re
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          tag='<script src="rating-official-fix.js?v=20260910-v2"></script>'
          s=re.sub(r'<script src="rating-official-fix.js[^"]*"></script>\\n?','',s)
          if 'rating-official-fix.js?v=20260910-v2' not in s:
              anchor='<script src="buffet-price-fix.js?v=20260910-final"></script>'
              s=s.replace(anchor,anchor+'\\n'+tag)
          p.write_text(s,encoding='utf-8')
      - name: Commit researched fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rating-official-fix.js research-summary.json index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Auto update ratings and official links v2'
          git push
