name: Inject contact rating fix
on:
  push:
    branches: [main]
    paths:
      - 'contact-rating-fix.js'
      - '.github/workflows/inject-contact-rating-fix.yml'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject script into index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="contact-rating-fix.js?v=20260910-1"></script>'
          if tag not in s:
              marker='<script src="buffet-price-fix.js?v=20260910-20260910-1"></script>'
              if marker in s:
                  s=s.replace(marker, marker+'\n'+tag)
              elif 'buffet-price-fix.js' in s:
                  s=s.replace('</body>', tag+'\n</body>')
              else:
                  s=s.replace('</body>', '<script src="contact-rating-fix.js?v=20260910-1"></script>\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit index update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'inject contact rating fix'
          git push
