name: Inject contact rating fix
on:
  push:
    branches: [main]
    paths:
      - 'contact-rating-fix.js'
      - '.github/workflows/inject-contact-rating-fix.yml'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject latest contact rating fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="contact-rating-fix.js?v=20260910-1"></script>'
          new='<script src="contact-rating-fix.js?v=20260910-2"></script>'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              marker='<script src="buffet-price-fix.js?v=20260910-20260910-1"></script>'
              if marker in s:
                  s=s.replace(marker,marker+'\n'+new,1)
              else:
                  s=s.replace('</body>',new+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit index update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'chore: load final contact rating fix'
          git push
