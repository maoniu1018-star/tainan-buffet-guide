name: Monthly Buffet Update

on:
  workflow_dispatch:
  schedule:
    - cron: "15 19 1 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python updater.py
      - name: Commit monthly check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json update-report.md
          git diff --cached --quiet || git commit -m "chore: monthly buffet source check"
          git push
