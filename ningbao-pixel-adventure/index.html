<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#17152b">
<title>寧寶貓的月光冒險</title>
<style>
:root{--bg:#17152b;--cream:#fff4d8;--pink:#ff9fc8;--gold:#ffd166;--purple:#aaa0ff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--cream);font-family:ui-monospace,Menlo,monospace;overscroll-behavior:none}
body{display:flex;justify-content:center;touch-action:pan-y}
body.playing{overflow:hidden;position:fixed;inset:0}
main{width:min(100%,520px);padding:calc(8px + env(safe-area-inset-top)) 10px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
header{text-align:center;flex-shrink:0}h1{font-size:clamp(19px,5vw,27px);margin:3px 0;color:#ffd9e9;text-shadow:3px 3px #704c9c}.sub{font-size:10px;color:#b9b4dc}
.panel{background:#282441;border:3px solid #7465a8;box-shadow:0 4px 0 #0d0c1c;border-radius:8px;padding:8px}
.stats{display:flex;justify-content:space-between;gap:6px;font-size:11px;flex-wrap:wrap}.stats b{color:var(--gold)}
.game-wrap{position:relative;width:100%;border:4px solid var(--gold);border-radius:5px;overflow:hidden;background:#26234d;line-height:0;touch-action:none;flex-shrink:0}
canvas{display:block;width:100%;height:auto;aspect-ratio:320/400;image-rendering:pixelated;touch-action:none}
.overlay{position:absolute;inset:0;pointer-events:none}
.dpad{position:absolute;left:3%;bottom:4%;width:36%;aspect-ratio:1;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:4px;pointer-events:auto;touch-action:none}
.ctrl{border:2px solid #fff1d7a8;border-radius:12px;background:#27223dc9;color:#fff4d8;font-size:clamp(18px,5vw,26px);font-weight:bold;padding:0;box-shadow:0 3px 0 #100e21;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
.ctrl:active,.ctrl.active{background:#ff9fc8e8;color:#241934;transform:scale(.96)}
.ctrl.up{grid-column:2;grid-row:1}.ctrl.left{grid-column:1;grid-row:2}.ctrl.right{grid-column:3;grid-row:2}.ctrl.down{grid-column:2;grid-row:3}
.action{position:absolute;right:4%;bottom:6%;width:24%;aspect-ratio:1;border-radius:50%;background:#aaa0ffe8;border:3px solid #fff1d7;color:#211a39;font-size:clamp(12px,3.6vw,17px);font-weight:900;pointer-events:auto;touch-action:none;box-shadow:0 4px 0 #6556a9;line-height:1.2;padding:3px}
.action:active,.action.active{transform:scale(.94);background:#ffd166}
.help{text-align:center;font-size:10px;line-height:1.5;color:#d2cdea}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.utility{font:inherit;font-weight:bold;border:0;border-radius:7px;padding:10px 5px;color:#211a39;background:var(--gold);box-shadow:0 3px 0 #a36e45;touch-action:manipulation}
button.utility.purple{background:var(--purple);box-shadow:0 3px 0 #6556a9}
.message{text-align:center;min-height:38px;font-size:11px;line-height:1.5;color:#fff1b4}
footer{text-align:center;font-size:9px;color:#77739c}
@media(max-height:740px){main{gap:5px;padding-top:5px}.sub{font-size:9px}.help{font-size:9px}.panel{padding:6px}.controls button.utility{padding:8px 4px}.message{min-height:30px}}
</style>
</head>
<body>
<main>
<header><h1>✦ 寧寶貓的月光冒險 ✦</h1><div class="sub">PIXEL QUEST · 第 1 關：月光森林</div></header>
<div class="panel stats"><span>♥ 生命：<b id="hp">3</b></span><span>✦ 月光幣：<b id="coins">0</b>/5</span><span>關卡：<b>01</b></span></div>
<div class="game-wrap" id="gameWrap">
<canvas id="game" width="320" height="400" aria-label="寧寶貓月光森林遊戲畫面"></canvas>
<div class="overlay">
 <div class="dpad" aria-label="方向控制">
  <button class="ctrl up" data-key="up" aria-label="向上">▲</button>
  <button class="ctrl left" data-key="left" aria-label="向左">◀</button>
  <button class="ctrl right" data-key="right" aria-label="向右">▶</button>
  <button class="ctrl down" data-key="down" aria-label="向下">▼</button>
 </div>
 <button class="action" id="jump" aria-label="跳躍">跳<br>躍</button>
</div>
</div>
<div class="help">直接在遊戲畫面按方向鍵：◀ ▶ 移動、▲ 跳躍、▼ 快速下降。右側紫色按鈕也可跳躍。<br>方向鍵可持續按住；畫面已鎖定，避免操作時整頁滑動。</div>
<div class="controls"><button class="utility" id="restart">↻ 重新開始</button><button class="utility purple" id="sound">♪ 音效：關</button></div>
<div id="message" class="panel message">跳躍高度已加強！按住 ▲ 或右側「跳躍」鍵，跳上平台收集 5 枚月光幣。</div>
<footer>寧寶貓原創像素冒險 · 手機觸控操作版</footer>
</main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
const hpEl=document.getElementById('hp'),coinEl=document.getElementById('coins'),msg=document.getElementById('message');
const T=20,W=16,H=20,keys={};let player,coins,slimes,frame=0,won=false,lost=false,sound=false,audio=null,raf=0;
const solids=new Set(),tile=(x,y)=>x+','+y;
function world(){solids.clear();for(let x=0;x<W;x++)solids.add(tile(x,18));[[2,15,5],[8,14,4],[3,11,4],[9,10,4],[5,7,4],[11,6,3]].forEach(([x,y,n])=>{for(let i=0;i<n;i++)solids.add(tile(x+i,y))})}
function reset(){world();player={x:42,y:320,w:16,h:18,vx:0,vy:0,on:false,hp:3,inv:0,face:1};coins=[[4,14],[10,13],[5,10],[11,9],[12,5]].map(([x,y],i)=>({x:x*T+10,y:y*T+4,got:false,bob:i}));slimes=[{x:7.1,y:17.2,dir:1,min:6,max:10},{x:3.1,y:10.2,dir:1,min:3,max:6}];frame=0;won=lost=false;updateUI();msg.textContent='收集 5 枚月光幣，避開史萊姆，抵達右上角的月亮門！'}
function beep(freq=520,d=.07){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.type='square';o.frequency.value=freq;g.gain.value=.025;o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch(e){}}
function updateUI(){hpEl.textContent=player.hp;coinEl.textContent=coins.filter(c=>c.got).length}
function isSolid(px,py){return solids.has(tile(Math.floor(px/T),Math.floor(py/T)))}
function overlapsSolid(x,y){return isSolid(x+2,y+2)||isSolid(x+player.w-2,y+2)||isSolid(x+2,y+player.h-1)||isSolid(x+player.w-2,y+player.h-1)}
function damage(){if(player.inv>0)return;player.hp--;player.inv=90;beep(140,.15);updateUI();if(player.hp<=0){lost=true;msg.textContent='冒險暫停了！按「重新開始」再試一次。'}else{msg.textContent='被史萊姆碰到！還有 '+player.hp+' 顆心。';player.x=42;player.y=320;player.vx=0;player.vy=0}}
function move(){
 if(won||lost)return;
 const left=keys.left||keys.ArrowLeft||keys.a,right=keys.right||keys.ArrowRight||keys.d;
 player.vx=left?-2.15:right?2.15:0;if(left)player.face=-1;if(right)player.face=1;
 // ▲ jumps; allow a fresh press or held input to jump immediately upon landing
 if((keys.up||keys.ArrowUp||keys.w||keys[' '])&&player.on){player.vy=-8.2;player.on=false;beep(420)}
 if(keys.down||keys.ArrowDown||keys.s){player.vy=Math.max(player.vy,2.4)}
 // horizontal collision
 let nx=Math.max(0,Math.min(320-player.w,player.x+player.vx));
 if(!overlapsSolid(nx,player.y))player.x=nx;
 // vertical, resolve each direction to platform boundaries
 player.vy=Math.min(6.5,player.vy+.19);
 let ny=player.y+player.vy;
 if(player.vy>=0){
  const oldBottom=player.y+player.h,newBottom=ny+player.h;let land=null;
  for(const k of solids){const [tx,ty]=k.split(',').map(Number),px=tx*T,py=ty*T;
   if(player.x+player.w-2>px&&player.x+2<px+T&&oldBottom<=py+2&&newBottom>=py){if(land===null||py<land)land=py}
  }
  if(land!==null){player.y=land-player.h;player.vy=0;player.on=true}else{player.y=ny;player.on=false}
 }else{
  let hitCeil=false;
  for(const k of solids){const [tx,ty]=k.split(',').map(Number),px=tx*T,py=ty*T;if(player.x+player.w-2>px&&player.x+2<px+T&&player.y>=py+T-2&&ny<=py+T){hitCeil=true;break}}
  if(hitCeil){player.vy=0}else player.y=ny;
 }
 if(player.y>410){damage();player.x=42;player.y=320;player.vy=0;return}
 if(player.inv>0)player.inv--;
 for(const c of coins){if(!c.got&&Math.hypot(player.x+8-c.x,player.y+9-c.y)<17){c.got=true;beep(760,.1);updateUI();msg.textContent='叮！拿到月光幣了！'}}
 for(const s of slimes){s.x+=.035*s.dir;if(s.x>s.max)s.dir=-1;if(s.x<s.min)s.dir=1;
  if(player.inv===0&&Math.abs(player.x+8-(s.x*T+10))<16&&Math.abs(player.y+9-(s.y*T+10))<16){if(player.vy>1){s.x=s.min;player.vy=-3.4;beep(240)}else{damage();break}}
 }
 const n=coins.filter(c=>c.got).length;
 if(player.x>278&&player.y<130){if(n>=5){won=true;msg.textContent='通關成功！月光森林的星星都亮起來了 ✨';beep(880,.2)}else msg.textContent='月亮門還沒開！還差 '+(5-n)+' 枚月光幣。'}
}
function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function drawCat(x,y){rect(x+2,y+17,13,3,'#15142d');if(player.inv>0&&Math.floor(frame/5)%2===0)return;rect(x+12,y+11,5,4,'#f5e9d0');rect(x+15,y+9,4,4,'#ffd166');rect(x+2,y+1,5,6,'#fff3d6');rect(x+10,y+1,5,6,'#fff3d6');rect(x+1,y+5,15,12,'#fff3d6');rect(x+3,y+3,3,3,'#ff9fc8');rect(x+11,y+3,3,3,'#ff9fc8');rect(x+4,y+9,2,2,'#29243d');rect(x+11,y+9,2,2,'#29243d');rect(x+7,y+12,4,2,'#ff8fbd');rect(x+7,y+3,3,3,'#ffd166');rect(x+4,y+2,3,2,'#ff7daf');rect(x+10,y+2,3,2,'#ff7daf')}
function draw(){frame++;ctx.fillStyle='#26234d';ctx.fillRect(0,0,320,400);
 for(let i=0;i<45;i++){const x=(i*71+13)%320,y=(i*47+frame*.12)%300;rect(x,y,2,2,i%3===0?'#ffd166':'#bcb8f4')}
 ctx.fillStyle='#ffe7a6';ctx.beginPath();ctx.arc(280,38,17,0,Math.PI*2);ctx.fill();ctx.fillStyle='#26234d';ctx.beginPath();ctx.arc(288,31,15,0,Math.PI*2);ctx.fill();
 for(let x=0;x<320;x+=40){rect(x+9,85,4,70,'#34365f');rect(x,65,23,40,'#354b68');rect(x+4,56,16,20,'#416b70')}
 for(const k of solids){const [tx,ty]=k.split(',').map(Number),x=tx*T,y=ty*T;rect(x,y,20,20,ty>=18?'#476b62':'#66518b');rect(x,y,20,4,'#9ac27e');if(ty>=18)rect(x+12,y+11,4,3,'#36554e')}
 rect(278,76,26,44,'#ffd166');rect(282,80,18,36,'#6c4c8d');rect(286,84,10,28,'#ffcf75');rect(294,97,3,3,'#fff4d8');
 for(const c of coins){if(c.got)continue;const y=c.y+Math.sin(frame/8+c.bob)*3;rect(c.x-5,y-5,10,10,'#ffd166');rect(c.x-3,y-3,6,6,'#fff0a1');rect(c.x-1,y-2,2,4,'#d89a38')}
 for(const s of slimes){const x=s.x*T,y=s.y*T;rect(x+2,y+8,16,9,'#9b8cff');rect(x+5,y+4,10,5,'#9b8cff');rect(x+5,y+10,2,3,'#29243d');rect(x+13,y+10,2,3,'#29243d');rect(x+7,y+15,6,2,'#d7ccff')}
 drawCat(player.x,player.y);
 if(won||lost){rect(25,150,270,75,'#17152b');rect(29,154,262,67,'#ffd166');ctx.fillStyle='#29243d';ctx.textAlign='center';ctx.font='bold 15px monospace';ctx.fillText(won?'STAGE CLEAR!':'TRY AGAIN',160,181);ctx.font='10px monospace';ctx.fillText(won?'月光森林恢復光芒！':'再試一次就會成功！',160,201)}
}
function loop(){move();draw();raf=requestAnimationFrame(loop)}
// Touch controls live ON the game canvas. Prevent iOS Safari from scrolling/zooming while pressing them.
function bindButton(el,key){const down=e=>{e.preventDefault();keys[key]=true;el.classList.add('active');try{el.setPointerCapture(e.pointerId)}catch(_){}};const up=e=>{e.preventDefault();keys[key]=false;el.classList.remove('active')};el.addEventListener('pointerdown',down);['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(ev=>el.addEventListener(ev,up));el.addEventListener('contextmenu',e=>e.preventDefault())}
document.querySelectorAll('[data-key]').forEach(el=>bindButton(el,el.dataset.key));
bindButton(document.getElementById('jump'),'up');
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key===' ')keys[' ']=true});
document.addEventListener('keyup',e=>{keys[e.key]=false});
document.getElementById('restart').addEventListener('click',reset);
document.getElementById('sound').addEventListener('click',()=>{sound=!sound;document.getElementById('sound').textContent='♪ 音效：'+(sound?'開':'關');if(sound)beep()});
document.getElementById('gameWrap').addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
reset();if(raf)cancelAnimationFrame(raf);loop();
})();
</script>
</body></html>
