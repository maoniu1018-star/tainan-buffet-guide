function draw(){x.save();if(shake>.5)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);bg();gems.forEach(g=>{if(g.got)return;x.save();x.translate(g.x,g.y+Math.sin(frame*.08+g.x)*4);x.rotate(.78);x.shadowBlur=14;x.shadowColor='#fff0a6';rect(-7,-7,14,14,'#fff0a6');rect(-3,-3,6,6,'#ff9acb');x.restore()});foes.forEach(foe);shots.forEach(s=>{x.save();x.shadowBlur=15;x.shadowColor='#ffe5a1';x.fillStyle='#fff3b0';x.beginPath();x.arc(s.x,s.y,7,0,7);x.fill();x.restore()});fx.forEach(a=>{x.globalAlpha=Math.max(0,a.life/35);rect(a.x,a.y,a.size,a.size,a.color)});x.globalAlpha=1;hero();if(won||lost){rect(30,205,330,95,'#20143cdd');x.fillStyle='#fff0bb';x.textAlign='center';x.font='bold 21px system-ui';x.fillText(won?'STAR MISSION CLEAR!':'TRY AGAIN',195,244);x.font='14px system-ui';x.fillText(won?'月光守護者，妳做到了！':'重新開始，再次挑戰！',195,273)}x.restore()}
function hold(id,fn){let el=$(id);let end=e=>{e.preventDefault();el.classList.remove('down')};el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('down');fn();try{el.setPointerCapture(e.pointerId)}catch(_){}});['pointerup','pointercancel','lostpointercapture'].forEach(k=>el.addEventListener(k,end))}
let joy=$('joy'),stick=$('stick'),jid=null;function jm(e){let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=r.width*.3,l=Math.hypot(dx,dy);if(l>m){dx=dx/l*m;dy=dy/l*m}stick.style.transform='translate('+dx+'px,'+dy+'px)';keys.left=dx<-10;keys.right=dx>10}joy.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;joy.setPointerCapture(jid);jm(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e)});function je(e){if(e.pointerId!==jid)return;jid=null;keys.left=keys.right=false;stick.style.transform='translate(0,0)'}['pointerup','pointercancel','lostpointercapture'].forEach(k=>joy.addEventListener(k,je));
hold('attack',attack);hold('jump',jump);hold('magic',magic);hold('trans',trans);$('restart').onclick=reset;$('nextLevel').onclick=()=>{level=2;reset()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent='♫ 音效：'+(sound?'開':'關');beep()};document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='ArrowUp'||e.key===' ')jump();if(e.key==='j')attack();if(e.key==='k')magic();if(e.key==='t')trans()});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false});$('game').addEventListener('touchmove',e=>e.preventDefault(),{passive:false});reset();update()})();
</script></body></html>
